services:
  mysql:
    image: mysql:8.4
    container_name: interviewiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interviewiq
      MYSQL_USER: interviewiq
      MYSQL_PASSWORD: interviewiqpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: interviewiq-server
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: interviewiq
      DB_USERNAME: interviewiq
      DB_PASSWORD: interviewiqpass
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./server:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: interviewiq-client
    restart: unless-stopped
    working_dir: /app
    command: npm start
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_URL: http://localhost:8080
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - server
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  maven_cache:
  client_node_modules:
