spring.application.name=server

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:interviewiq}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:interviewiq}
spring.datasource.password=${DB_PASSWORD:interviewiqpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZUJhc2U2NEpXVEtleUZvckludGVydmlld0lRU2VydmVy}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Required for reliable restart detection when source files are bind-mounted into containers.
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
